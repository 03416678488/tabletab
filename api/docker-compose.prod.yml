services:
  tabletap-api-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: tabletap-api-prod
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_NAME: ${APP_NAME}
      APP_DESCRIPTION: ${APP_DESCRIPTION}
      APP_VERSION: ${APP_VERSION}
      APP_PORT: ${APP_PORT}
      APP_ENV: ${APP_ENV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_JWT_EXPIRE_IN: ${REFRESH_JWT_EXPIRE_IN}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_URL_NETWORK: ${FRONTEND_URL_NETWORK}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    depends_on:
      - tabletap-postgres
      - tabletap-redis
    networks:
      - tabletap-backend-prod
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tabletap-postgres:
    image: postgres:15
    container_name: tabletap-postgres-prod
    restart: always
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tabletap_postgres_data_prod:/var/lib/postgresql/data
    networks:
      - tabletap-backend-prod
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tabletap-redis:
    image: redis:7.0-alpine
    container_name: tabletap-redis-prod
    restart: always
    ports:
      - "${REDIS_HOST_PORT}:6379"
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./.config/redis.conf:/etc/redis/redis.conf
      - tabletap_redis_data_prod:/data
    networks:
      - tabletap-backend-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tabletap_postgres_data_prod:
    driver: local
  tabletap_redis_data_prod:
    driver: local

networks:
  tabletap-backend-prod:
    driver: bridge
