services:
  tabletap-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tabletap-api
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_NAME: ${APP_NAME}
      APP_DESCRIPTION: ${APP_DESCRIPTION}
      APP_VERSION: ${APP_VERSION}
      APP_PORT: ${APP_PORT}
      APP_ENV: ${APP_ENV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PLATFORM_IMPERSONATION_KEY: ${PLATFORM_IMPERSONATION_KEY}
      IMPERSONATION_EXPIRES_IN: ${IMPERSONATION_EXPIRES_IN}
      CONTROL_PLANE_DB: ${CONTROL_PLANE_DB}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET}
      REFRESH_JWT_EXPIRES_IN: ${REFRESH_JWT_EXPIRES_IN:-7d}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_URL_NETWORK: ${FRONTEND_URL_NETWORK}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      - postgres
      - redis
    networks:
      - tabletap-backend
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run start:dev"

  tabletap-seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabletap-seed
    volumes:
      - .:/app
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - tabletap-backend
    command: sh -c "npm install && npm run db:seed"
    profiles:
      - seed

  postgres:
    image: postgres:15
    container_name: ${POSTGRES_HOST}
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tabletap_postgres_data:/var/lib/postgresql/data
    networks:
      - tabletap-backend

  redis:
    image: redis:7.0-alpine
    container_name: ${REDIS_HOST}
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./.config/redis.conf:/etc/redis/redis.conf
      - tabletap_redis_data:/data
    networks:
      - tabletap-backend

  # Web DB admin UI. Open http://localhost:${PGADMIN_PORT:-5050} and log in with
  # PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD. The "TableTap (dev)" server
  # is pre-registered (servers.json) and points at the postgres service on the
  # shared network; the password is pre-filled from pgpass (fallback: "secret").
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tabletap-pgadmin
    restart: unless-stopped
    user: root
    depends_on:
      - postgres
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@tabletap.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      # Desktop mode: no per-session login gate + no master password prompt.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - tabletap_pgadmin_data:/var/lib/pgadmin
      - ./.config/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./.config/pgpass:/pgpass.src:ro
    # pgAdmin ignores a passfile unless it is 0600 — a macOS bind mount can't be,
    # so copy it into the writable data dir with the right perms before boot.
    entrypoint:
      - /bin/sh
      - -c
      - "cp -f /pgpass.src /var/lib/pgpass && chmod 600 /var/lib/pgpass && chown 5050:5050 /var/lib/pgpass && exec /entrypoint.sh"
    networks:
      - tabletap-backend

volumes:
  tabletap_postgres_data:
  tabletap_redis_data:
  tabletap_pgadmin_data:

networks:
  tabletap-backend:
    name: tabletap_network